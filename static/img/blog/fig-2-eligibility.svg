<svg viewBox="0 0 680 430" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Sora, system-ui, -apple-system, Segoe UI, sans-serif">
<title>Who actually gets credits</title>
<desc>Eligible plans and monthly credit amounts for OpenAI, Claude and Google, plus the entry-level plans that receive nothing.</desc>
<rect x="0" y="0" width="680" height="430" rx="14" fill="#141517" stroke="#34373a" stroke-width="0.5"/>
<text x="40" y="45" font-size="15" font-weight="500" fill="#f2f2ee">Who actually gets credits</text>
<text x="40" y="68" font-size="12" fill="#b4b6b0">Monthly amounts. Each needs an active paid plan.</text>
<rect x="40" y="92" width="600" height="80" rx="12" fill="#1c1e20" stroke="#34373a" stroke-width="0.5"/>
<text x="60" y="122" font-size="14" font-weight="500" fill="#f2f2ee">OpenAI</text>
<text x="60" y="146" font-size="11" fill="#b4b6b0">not Plus, Go, Free</text>
<text x="210" y="122" font-size="13" fill="#e6e7e2">ChatGPT Pro tiers</text>
<text x="620" y="122" font-size="13" text-anchor="end" fill="#c8f031">$100 / $200 / $500</text>
<text x="210" y="148" font-size="13" fill="#e6e7e2">Business seats (cap $500)</text>
<text x="620" y="148" font-size="13" text-anchor="end" fill="#c8f031">$20 / $100 per seat</text>
<rect x="40" y="184" width="600" height="80" rx="12" fill="#1c1e20" stroke="#34373a" stroke-width="0.5"/>
<text x="60" y="214" font-size="14" font-weight="500" fill="#f2f2ee">Claude</text>
<text x="60" y="238" font-size="11" fill="#b4b6b0">not Free, Pro</text>
<text x="210" y="214" font-size="13" fill="#e6e7e2">Max / Ultra</text>
<text x="620" y="214" font-size="13" text-anchor="end" fill="#c8f031">$100 / $200</text>
<text x="210" y="240" font-size="13" fill="#e6e7e2">Team seats (cap $500)</text>
<text x="620" y="240" font-size="13" text-anchor="end" fill="#c8f031">$20 / $100 per seat</text>
<rect x="40" y="276" width="600" height="80" rx="12" fill="#1c1e20" stroke="#34373a" stroke-width="0.5"/>
<text x="60" y="306" font-size="14" font-weight="500" fill="#f2f2ee">Google</text>
<text x="60" y="330" font-size="11" fill="#b4b6b0">not AI Plus, free</text>
<text x="210" y="306" font-size="13" fill="#e6e7e2">Google AI Pro</text>
<text x="620" y="306" font-size="13" text-anchor="end" fill="#c8f031">$10</text>
<text x="210" y="332" font-size="13" fill="#e6e7e2">Google AI Ultra 5x / 20x</text>
<text x="620" y="332" font-size="13" text-anchor="end" fill="#c8f031">$40 / $100</text>
<rect x="40" y="370" width="600" height="36" rx="8" fill="#1c1e20" stroke="#c8f031" stroke-width="0.5"/>
<text x="60" y="393" font-size="13" font-weight="500" fill="#f2f2ee">ChatGPT Plus, Claude Pro and Google AI Plus get no credits</text>
</svg>
