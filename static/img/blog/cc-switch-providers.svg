<svg viewBox="0 0 680 340" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Sora, system-ui, -apple-system, Segoe UI, sans-serif">
<title>One app, many providers</title>
<desc>CC Switch keeps a list of providers such as TokHive, Claude Official and others. When you switch, it writes only the active provider's endpoint, key, model and API format into Claude Code's settings.json and Codex's config.toml, leaving other settings unchanged.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="340" rx="14" fill="#141517" stroke="#34373a" stroke-width="0.5"/>
<text x="40" y="45" font-size="15" font-weight="500" fill="#f2f2ee">One app, many providers</text>
<text x="40" y="68" font-size="12" fill="#b4b6b0">CC Switch writes the active provider into each tool's own config</text>

<text x="40" y="98" font-size="11" fill="#b4b6b0">PROVIDERS</text>
<rect x="40" y="108" width="180" height="44" rx="10" fill="#1c1e20" stroke="#c8f031" stroke-width="0.75"/>
<text x="56" y="135" font-size="13" font-weight="500" fill="#c8f031">TokHive</text>
<text x="204" y="135" font-size="11" text-anchor="end" fill="#c8f031">In use</text>
<rect x="40" y="164" width="180" height="44" rx="10" fill="#1c1e20" stroke="#34373a" stroke-width="0.5"/>
<text x="56" y="191" font-size="13" fill="#e6e7e2">Claude Official</text>
<rect x="40" y="220" width="180" height="44" rx="10" fill="#1c1e20" stroke="#34373a" stroke-width="0.5"/>
<text x="56" y="247" font-size="13" fill="#e6e7e2">Other provider</text>

<rect x="270" y="118" width="140" height="136" rx="12" fill="#1c1e20" stroke="#34373a" stroke-width="0.5"/>
<text x="340" y="176" font-size="14" font-weight="500" text-anchor="middle" fill="#f2f2ee">CC Switch</text>
<text x="340" y="198" font-size="12" text-anchor="middle" fill="#b4b6b0">one click or</text>
<text x="340" y="215" font-size="12" text-anchor="middle" fill="#b4b6b0">tray menu</text>

<path d="M224 130 L266 160" fill="none" stroke="#c8f031" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M224 186 L266 186" fill="none" stroke="#5a5d60" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M224 242 L266 212" fill="none" stroke="#5a5d60" stroke-width="1" stroke-dasharray="4 4"/>

<text x="480" y="98" font-size="11" fill="#b4b6b0">TOOL CONFIG</text>
<rect x="480" y="108" width="160" height="64" rx="10" fill="#1c1e20" stroke="#34373a" stroke-width="0.5"/>
<text x="496" y="134" font-size="13" font-weight="500" fill="#f2f2ee">Claude Code</text>
<text x="496" y="156" font-size="11" fill="#b4b6b0">~/.claude/settings.json</text>
<rect x="480" y="200" width="160" height="64" rx="10" fill="#1c1e20" stroke="#34373a" stroke-width="0.5"/>
<text x="496" y="226" font-size="13" font-weight="500" fill="#f2f2ee">Codex</text>
<text x="496" y="248" font-size="11" fill="#b4b6b0">~/.codex/config.toml</text>

<path d="M414 165 L476 142" fill="none" stroke="#c8f031" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M414 207 L476 230" fill="none" stroke="#c8f031" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="40" y1="288" x2="640" y2="288" stroke="#34373a" stroke-width="0.5"/>
<text x="40" y="312" font-size="12" fill="#e6e7e2">Only the endpoint, key, model and API format change. Your other settings stay as they are.</text>
</svg>
