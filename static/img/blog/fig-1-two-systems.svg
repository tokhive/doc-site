<svg viewBox="0 0 680 340" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Sora, system-ui, -apple-system, Segoe UI, sans-serif">
<title>One link between two systems</title>
<desc>A subscription and an API organization are billed separately. Monthly credits flow from an eligible subscription into exactly one linked API organization.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="340" rx="14" fill="#141517" stroke="#34373a" stroke-width="0.5"/>
<text x="40" y="45" font-size="15" font-weight="500" fill="#f2f2ee">One link between two systems</text>
<text x="40" y="68" font-size="12" fill="#b4b6b0">Subscriptions and API platforms are billed separately</text>
<rect x="40" y="100" width="250" height="160" rx="12" fill="#1c1e20" stroke="#34373a" stroke-width="0.5"/>
<text x="60" y="128" font-size="14" font-weight="500" fill="#f2f2ee">Subscription</text>
<text x="60" y="150" font-size="12" fill="#b4b6b0">ChatGPT / claude.ai</text>
<line x1="60" y1="166" x2="270" y2="166" stroke="#34373a" stroke-width="0.5"/>
<text x="60" y="188" font-size="13" fill="#e6e7e2">Chat app usage</text>
<text x="60" y="210" font-size="13" fill="#e6e7e2">Plan usage limits</text>
<text x="60" y="232" font-size="13" fill="#e6e7e2">Claude Code / signed-in Codex</text>
<rect x="390" y="100" width="250" height="160" rx="12" fill="#1c1e20" stroke="#c8f031" stroke-width="0.5"/>
<text x="410" y="128" font-size="14" font-weight="500" fill="#c8f031">API organization</text>
<text x="410" y="150" font-size="12" fill="#b4b6b0">OpenAI / Claude Console</text>
<line x1="410" y1="166" x2="620" y2="166" stroke="#34373a" stroke-width="0.5"/>
<text x="410" y="188" font-size="13" fill="#e6e7e2">Your API keys</text>
<text x="410" y="210" font-size="13" fill="#e6e7e2">Apps and agents</text>
<text x="410" y="232" font-size="13" fill="#e6e7e2">Credit balance</text>
<path d="M295 185 L385 185" fill="none" stroke="#c8f031" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="170" font-size="12" text-anchor="middle" fill="#c8f031">monthly credits</text>
<text x="340" y="212" font-size="12" text-anchor="middle" fill="#b4b6b0">claim once</text>
<text x="340" y="230" font-size="12" text-anchor="middle" fill="#b4b6b0">1 org only</text>
<line x1="40" y1="278" x2="640" y2="278" stroke="#34373a" stroke-width="0.5"/>
<text x="40" y="300" font-size="12" fill="#b4b6b0">Credits never increase chat, Claude Code or signed-in Codex usage limits</text>
</svg>
