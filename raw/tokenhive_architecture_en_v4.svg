<svg width="100%" viewBox="0 0 680 330" role="img" xmlns="http://www.w3.org/2000/svg">
<title>TokHive system architecture</title>
<desc>Request flow: the Consumer calls Hive over HTTPS. Hive hands the request to the TEE as a job over mTLS. The TEE holds the provider's sealed credential and opens a TLS session to the upstream AI API that is end to end; its encrypted bytes are relayed through Hive and over a WebSocket to Bee on the provider's machine, which sends them to the upstream from the provider's own IP.</desc>
<style>
  text { font-family: anthropic-sans, -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .title { font-size: 14px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
  .sub { font-size: 12px; font-weight: 400; text-anchor: middle; dominant-baseline: central; }
  .label { font-size: 12px; fill: rgb(82, 81, 78); }
  .muted { font-size: 12px; fill: rgb(82, 81, 78); text-anchor: middle; }
  .flow { fill: none; stroke: rgb(137, 135, 129); stroke-width: 1.5px; }
  .tls { fill: none; stroke: rgb(133, 79, 11); stroke-width: 1.5px; stroke-dasharray: 5 4; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="400" y="32" width="260" height="285" rx="16" fill="none" stroke="rgba(11, 11, 11, 0.1)" stroke-width="1" stroke-dasharray="6 4"/>
<text x="530" y="54" class="muted" style="font-size:12px">Provider's machine</text>

<rect x="440" y="125" width="190" height="56" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5" opacity="0.3"/>
<rect x="435" y="120" width="190" height="56" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5" opacity="0.5"/>

<rect x="30" y="115" width="120" height="56" rx="8" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)" stroke-width="0.5"/>
<text x="90" y="137" class="title" fill="rgb(12, 68, 124)">Consumer</text>
<text x="90" y="157" class="sub" fill="rgb(24, 95, 165)">AI end user</text>

<rect x="200" y="115" width="150" height="56" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
<text x="275" y="137" class="title" fill="rgb(60, 52, 137)">Hive</text>
<text x="275" y="157" class="sub" fill="rgb(83, 74, 183)">Route · Auth · Billing</text>

<rect x="200" y="230" width="150" height="56" rx="8" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
<text x="275" y="250" class="title" fill="rgb(99, 56, 6)">TEE</text>
<text x="275" y="270" class="sub" fill="rgb(133, 79, 11)">Trusted execution</text>

<rect x="430" y="115" width="190" height="56" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
<text x="525" y="137" class="title" fill="rgb(8, 80, 65)">Bee</text>
<text x="525" y="157" class="sub" fill="rgb(15, 110, 86)">Provider client</text>

<rect x="430" y="230" width="190" height="56" rx="8" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)" stroke-width="0.5"/>
<text x="525" y="250" class="title" fill="rgb(113, 43, 19)">Upstream AI API</text>
<text x="525" y="270" class="sub" fill="rgb(153, 60, 29)">OpenAI / Anthropic …</text>

<text x="175" y="108" class="label" text-anchor="middle">HTTPS</text>
<line x1="150" y1="143" x2="198" y2="143" class="flow" marker-end="url(#arrow)"/>

<text x="390" y="108" class="label" text-anchor="middle">WebSocket</text>
<line x1="350" y1="143" x2="428" y2="143" class="flow" marker-end="url(#arrow)"/>

<line x1="275" y1="171" x2="275" y2="228" class="flow" marker-end="url(#arrow)"/>
<text x="284" y="204" class="label">Job (mTLS)</text>

<line x1="525" y1="171" x2="525" y2="228" class="flow" marker-end="url(#arrow)"/>
<text x="534" y="204" class="label">Encrypted bytes</text>

<line x1="350" y1="258" x2="428" y2="258" class="tls" marker-end="url(#arrow)"/>
<text x="389" y="276" class="label" text-anchor="middle" style="font-size:11px">End-to-end</text>
<text x="389" y="290" class="label" text-anchor="middle" style="font-size:11px">TLS</text>

<text x="90" y="195" class="muted">OpenAI / Anthropic APIs</text>
<text x="90" y="211" class="muted">Just set base_url</text>

<text x="275" y="306" class="muted">Holds credentials · Signs receipts</text>
<text x="525" y="306" class="muted">From the provider's own IP</text>
</svg>
